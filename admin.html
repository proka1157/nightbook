<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NightBook Admin</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            background: #070707;
        }

        .admin-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px 100px;
        }

        .admin-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 35px;
        }

        .admin-top h1 {
            font-size: 42px;
        }

        .back-link {
            border: 1px solid #333;
            padding: 10px 14px;
            border-radius: 6px;
            color: #aaa;
        }

        .admin-card {
            background: #111;
            border: 1px solid #252525;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 25px;
        }

        .admin-card h2 {
            font-size: 28px;
            margin-bottom: 20px;
        }

        .admin-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .admin-form .full {
            grid-column: 1 / -1;
        }

        .admin-form label {
            display: block;
            margin-bottom: 6px;
            color: #aaa;
            font-size: 12px;
            font-weight: 700;
        }

        .admin-form input,
        .admin-form select,
        .admin-form textarea {
            width: 100%;
            background: #181818;
            border: 1px solid #333;
            color: #fff;
            padding: 13px;
            border-radius: 6px;
        }

        .admin-form textarea {
            min-height: 100px;
        }

        .admin-submit {
            background: #ffb800;
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-weight: 900;
        }

        .cancel-edit {
            background: transparent;
            color: #fff;
            border: 1px solid #444;
            padding: 14px;
            border-radius: 6px;
        }

        .admin-event {
            background: #171717;
            border: 1px solid #2b2b2b;
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 12px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .admin-event p {
            color: #888;
            font-size: 13px;
            margin-top: 4px;
        }

        .event-actions {
            display: flex;
            gap: 8px;
        }

        .edit-btn,
        .delete-btn {
            border: none;
            padding: 10px 12px;
            border-radius: 6px;
            font-weight: 800;
        }

        .edit-btn {
            background: #fff;
            color: #000;
        }

        .delete-btn {
            background: #9d1c1c;
            color: #fff;
        }

        .reservations-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #292929;
            text-align: left;
            font-size: 13px;
        }

        th {
            color: #ffb800;
        }

        .status {
            display: inline-block;
            background: #ffb800;
            color: #000;
            padding: 4px 7px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 900;
        }

        @media (max-width: 700px) {
            .admin-form {
                grid-template-columns: 1fr;
            }

            .admin-form .full {
                grid-column: auto;
            }

            .admin-event {
                flex-direction: column;
                align-items: flex-start;
            }

            .admin-top {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

<div class="admin-wrapper">

    <div class="admin-top">
        <div>
            <p class="section-label">ADMIN PANEL</p>
            <h1>NIGHT<span style="color:#ffb800;">BOOK</span></h1>
        </div>

        <a href="/" class="back-link">
            ← Nazad na sajt
        </a>
    </div>


    <section class="admin-card">

        <h2 id="formTitle">
            Dodaj događaj
        </h2>

        <form id="eventForm" class="admin-form">

            <input type="hidden" id="editId">

            <div>
                <label for="club">Klub</label>

                <select id="club" required>
                    <option value="">Izaberi klub</option>
                    <option value="Lasta">Lasta</option>
                    <option value="Freestyler">Freestyler</option>
                    <option value="Tranzit">Tranzit</option>
                    <option value="Remiks">Remiks</option>
                </select>
            </div>

            <div>
                <label for="date">Datum</label>
                <input type="date" id="date" required>
            </div>

            <div>
                <label for="title">Naziv događaja</label>

                <input
                    type="text"
                    id="title"
                    placeholder="Friday Night"
                    required
                >
            </div>

            <div>
                <label for="dj">DJ / Program</label>

                <input
                    type="text"
                    id="dj"
                    placeholder="DJ Marko"
                >
            </div>

            <div>
                <label for="time">Vreme</label>

                <input
                    type="text"
                    id="time"
                    placeholder="23:00"
                >
            </div>

            <div>
                <label for="price">Cena / Ulaz</label>

                <input
                    type="text"
                    id="price"
                    placeholder="500 RSD"
                >
            </div>

            <div class="full">
                <label for="description">Opis</label>

                <textarea
                    id="description"
                    placeholder="Informacije o događaju..."
                ></textarea>
            </div>

            <div class="full">
                <label for="image">Link slike / postera</label>

                <input
                    type="text"
                    id="image"
                    placeholder="https://..."
                >
            </div>

            <button
                type="submit"
                class="admin-submit"
            >
                SAČUVAJ DOGAĐAJ
            </button>

            <button
                type="button"
                id="cancelEdit"
                class="cancel-edit"
                style="display:none;"
            >
                OTKAŽI IZMENU
            </button>

        </form>

    </section>


    <section class="admin-card">

        <h2>Događaji</h2>

        <div id="adminEvents">
            Učitavanje...
        </div>

    </section>


    <section class="admin-card">

        <h2>Rezervacije</h2>

        <div class="reservations-wrap">

            <table>

                <thead>
                    <tr>
                        <th>Ime</th>
                        <th>Klub</th>
                        <th>Datum</th>
                        <th>Osobe</th>
                        <th>Telefon</th>
                        <th>Instagram</th>
                        <th>Napomena</th>
                        <th>Status</th>
                        <th>Akcija</th>
                    </tr>
                </thead>

                <tbody id="reservationsBody"></tbody>

            </table>

        </div>

    </section>

</div>

<script src="js/admin.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="sr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#050505">

    <title>NightBook Admin</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --yellow: #ffbd19;
            --black: #050505;
            --card: #0d0d0d;
            --card2: #121212;
            --border: #292929;
            --muted: #888;
            --white: #fff;
            --green: #3ddc84;
            --red: #ff5b5b;
            --whatsapp: #25D366;
        }

        html {
            background: var(--black);
        }

        body {
            min-height: 100vh;
            background: var(--black);
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }


        /* =========================
           HEADER
        ========================= */

        .admin-header {
            position: sticky;
            top: 0;
            z-index: 100;

            min-height: 74px;

            padding:
                max(18px, env(safe-area-inset-top))
                20px
                18px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background: rgba(5, 5, 5, .94);
            border-bottom: 1px solid #222;

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        .admin-logo {
            font-size: 22px;
            font-weight: 950;
            letter-spacing: -1px;
        }

        .admin-logo span {
            color: var(--yellow);
        }

        .admin-badge {
            padding: 8px 11px;

            border: 1px solid #333;
            border-radius: 999px;

            color: #aaa;

            font-size: 9px;
            font-weight: 900;
            letter-spacing: 1.5px;
        }


        /* =========================
           MAIN
        ========================= */

        .admin-container {
            width: min(1050px, 100%);

            margin: 0 auto;

            padding:
                38px
                18px
                calc(80px + env(safe-area-inset-bottom));
        }

        .eyebrow {
            color: var(--yellow);

            font-size: 10px;
            font-weight: 950;

            letter-spacing: 2.5px;
        }

        .admin-title {
            margin-bottom: 30px;
        }

        .admin-title h1 {
            margin-top: 8px;

            font-size: clamp(38px, 8vw, 70px);
            line-height: .95;

            letter-spacing: -3px;
            font-weight: 950;
        }

        .admin-title h1 span {
            color: var(--yellow);
        }

        .admin-description {
            max-width: 500px;

            margin-top: 14px;

            color: #888;

            font-size: 13px;
            line-height: 1.6;
        }


        /* =========================
           STATS
        ========================= */

        .stats-grid {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 10px;

            margin-bottom: 26px;
        }

        .stat-card {
            min-height: 110px;

            padding: 18px;

            display: flex;
            flex-direction: column;
            justify-content: space-between;

            background: var(--card);

            border: 1px solid var(--border);
            border-radius: 16px;
        }

        .stat-card span {
            color: #777;

            font-size: 9px;
            font-weight: 900;

            letter-spacing: 1.2px;
        }

        .stat-card strong {
            margin-top: 15px;

            font-size: 34px;
            font-weight: 950;
        }

        .stat-card.new strong {
            color: var(--yellow);
        }

        .stat-card.confirmed strong {
            color: var(--green);
        }


        /* =========================
           FILTERI
        ========================= */

        .admin-tools {
            padding: 16px;

            margin-bottom: 20px;

            background: #0a0a0a;

            border: 1px solid var(--border);
            border-radius: 16px;
        }

        .filters {
            display: grid;

            grid-template-columns:
                1fr 1fr 1fr;

            gap: 10px;
        }

        .filter-group label {
            display: block;

            margin-bottom: 7px;

            color: #777;

            font-size: 9px;
            font-weight: 900;

            letter-spacing: 1.2px;
        }

        .filter-group select,
        .filter-group input {
            width: 100%;
            height: 48px;

            padding: 0 12px;

            border: 1px solid #303030;
            border-radius: 10px;

            background: #111;
            color: white;

            font-size: 13px;

            outline: none;
        }

        .filter-group select:focus,
        .filter-group input:focus {
            border-color: var(--yellow);
        }

        .refresh-button {
            width: 100%;
            min-height: 50px;

            margin-top: 12px;

            border: none;
            border-radius: 10px;

            background: var(--yellow);
            color: #000;

            font-size: 10px;
            font-weight: 950;

            letter-spacing: 1.5px;

            cursor: pointer;
        }

        .refresh-button:disabled {
            opacity: .5;
            cursor: default;
        }


        /* =========================
           RESERVATION
        ========================= */

        .reservation-card {
            position: relative;

            padding: 20px;

            margin-bottom: 15px;

            background: var(--card);

            border: 1px solid var(--border);
            border-radius: 18px;

            overflow: hidden;
        }

        .reservation-card.status-nova {
            border-left: 3px solid var(--yellow);
        }

        .reservation-card.status-potvrdjena {
            border-left: 3px solid var(--green);
        }

        .reservation-card.status-odbijena {
            border-left: 3px solid var(--red);
        }

        .reservation-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;

            gap: 15px;

            margin-bottom: 18px;
        }

        .reservation-id {
            margin-bottom: 7px;

            color: #555;

            font-size: 9px;
            font-weight: 900;

            letter-spacing: 1px;
        }

        .reservation-club {
            color: white;

            font-size: 22px;
            font-weight: 950;

            text-transform: uppercase;
        }

        .reservation-date {
            margin-top: 5px;

            color: var(--yellow);

            font-size: 13px;
            font-weight: 900;
        }


        /* =========================
           STATUS
        ========================= */

        .status {
            flex-shrink: 0;

            padding: 8px 11px;

            border-radius: 999px;

            font-size: 9px;
            font-weight: 950;

            letter-spacing: 1px;
        }

        .status.nova {
            background: var(--yellow);
            color: #000;
        }

        .status.potvrdjena {
            background: rgba(61, 220, 132, .13);
            color: var(--green);

            border: 1px solid rgba(61, 220, 132, .35);
        }

        .status.odbijena {
            background: rgba(255, 91, 91, .12);
            color: var(--red);

            border: 1px solid rgba(255, 91, 91, .35);
        }


        /* =========================
           INFO
        ========================= */

        .reservation-grid {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 9px;
        }

        .info-box {
            min-width: 0;

            padding: 13px;

            background: #090909;

            border: 1px solid #1d1d1d;
            border-radius: 11px;
        }

        .info-box span,
        .condition-box span {
            display: block;

            margin-bottom: 6px;

            color: #666;

            font-size: 8px;
            font-weight: 900;

            letter-spacing: 1px;
        }

        .info-box strong {
            display: block;

            color: #fff;

            font-size: 13px;
            line-height: 1.35;

            word-break: break-word;
        }

        .info-link {
            color: white;
            text-decoration: none;
        }

        .info-link:hover {
            color: var(--yellow);
        }

        .condition-box {
            margin-top: 9px;
            padding: 14px;

            background: rgba(255, 189, 25, .05);

            border: 1px solid rgba(255, 189, 25, .35);
            border-radius: 11px;
        }

        .condition-box strong {
            color: var(--yellow);

            font-size: 13px;
        }


        /* =========================
           ACTIONS
        ========================= */

        .reservation-actions {
            display: grid;

            grid-template-columns:
                1fr 1fr 1fr auto;

            gap: 8px;

            margin-top: 15px;
        }

        .action-button {
            min-height: 46px;

            padding: 0 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 1px solid #333;
            border-radius: 10px;

            background: #151515;
            color: white;

            font-family: Arial, Helvetica, sans-serif;
            font-size: 9px;
            font-weight: 950;

            letter-spacing: 1px;

            text-decoration: none;
            text-align: center;

            cursor: pointer;

            -webkit-tap-highlight-color: transparent;
        }


        /* WHATSAPP */

        .action-button.whatsapp-button {
            background: var(--whatsapp);
            border-color: var(--whatsapp);

            color: #041b0d;
        }

        .action-button.whatsapp-button:hover {
            opacity: .9;
        }


        /* POTVRDI */

        .action-button.confirm {
            border-color:
                rgba(61, 220, 132, .35);

            color: var(--green);
        }


        /* ODBIJ */

        .action-button.reject {
            border-color:
                rgba(255, 91, 91, .35);

            color: var(--red);
        }


        /* OBRIŠI */

        .action-button.delete {
            min-width: 70px;

            color: #777;
        }

        .action-button:disabled {
            opacity: .35;
            cursor: default;
        }


        /* =========================
           EMPTY / MESSAGE
        ========================= */

        .admin-message {
            display: none;

            margin-bottom: 15px;
            padding: 13px;

            border: 1px solid #333;
            border-radius: 10px;

            background: #0d0d0d;

            color: #aaa;

            font-size: 12px;
        }

        .admin-message.show {
            display: block;
        }

        .empty {
            padding: 60px 20px;

            text-align: center;

            color: #666;

            border: 1px dashed #292929;
            border-radius: 16px;

            font-size: 13px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .admin-container {
                padding-top: 30px;
            }

            .admin-title h1 {
                letter-spacing: -2px;
            }

            .stats-grid {
                grid-template-columns:
                    repeat(3, 1fr);

                gap: 7px;
            }

            .stat-card {
                min-height: 92px;

                padding: 13px;
            }

            .stat-card span {
                font-size: 7px;
            }

            .stat-card strong {
                font-size: 28px;
            }

            .filters {
                grid-template-columns: 1fr;
            }

            .reservation-grid {
                grid-template-columns:
                    1fr 1fr;
            }

        }


        @media (max-width: 420px) {

            .reservation-card {
                padding: 16px;
            }

            .reservation-club {
                font-size: 19px;
            }

            .reservation-grid {
                grid-template-columns: 1fr;
            }


            /* 4 dugmeta = 2 x 2 */

            .reservation-actions {
                grid-template-columns:
                    1fr 1fr;

                gap: 8px;
            }

            .action-button {
                width: 100%;
                min-height: 48px;
            }

            .action-button.delete {
                min-width: 0;
                grid-column: auto;
            }

        }

    </style>

</head>


<body>


<header class="admin-header">

    <div class="admin-logo">
        NIGHT<span>BOOK</span>
    </div>

    <div class="admin-badge">
        ADMIN PANEL
    </div>

</header>


<main class="admin-container">


    <section class="admin-title">

        <p class="eyebrow">
            NIGHTBOOK ADMIN
        </p>

        <h1>
            REZERVA<span>CIJE.</span>
        </h1>

        <p class="admin-description">
            Pregledaj i upravljaj svim NightBook rezervacijama.
        </p>

    </section>


    <!-- STATS -->

    <section class="stats-grid">

        <div class="stat-card">

            <span>
                UKUPNO
            </span>

            <strong id="reservationCount">
                0
            </strong>

        </div>


        <div class="stat-card new">

            <span>
                NOVE
            </span>

            <strong id="newCount">
                0
            </strong>

        </div>


        <div class="stat-card confirmed">

            <span>
                POTVRĐENE
            </span>

            <strong id="confirmedCount">
                0
            </strong>

        </div>

    </section>


    <!-- FILTERI -->

    <section class="admin-tools">

        <div class="filters">


            <div class="filter-group">

                <label for="clubFilter">
                    KLUB
                </label>

                <select id="clubFilter">

                    <option value="">
                        Svi klubovi
                    </option>

                    <option value="lasta">
                        Lasta
                    </option>

                    <option value="freestyler">
                        Freestyler
                    </option>

                    <option value="remiks">
                        Remiks
                    </option>

                    <option value="tranzit">
                        Tranzit
                    </option>

                    <option value="bank">
                        The Bank
                    </option>

                    <option value="leto">
                        Leto
                    </option>

                    <option value="gradska">
                        Gradska Kafana
                    </option>

                </select>

            </div>


            <div class="filter-group">

                <label for="statusFilter">
                    STATUS
                </label>

                <select id="statusFilter">

                    <option value="">
                        Svi statusi
                    </option>

                    <option value="nova">
                        Nova
                    </option>

                    <option value="potvrdjena">
                        Potvrđena
                    </option>

                    <option value="odbijena">
                        Odbijena
                    </option>

                </select>

            </div>


            <div class="filter-group">

                <label for="dateFilter">
                    DATUM
                </label>

                <input
                    type="date"
                    id="dateFilter"
                >

            </div>

        </div>


        <button
            type="button"
            class="refresh-button"
            id="refreshReservations"
        >
            OSVEŽI REZERVACIJE
        </button>

    </section>


    <div
        id="adminMessage"
        class="admin-message"
    ></div>


    <section id="reservationsList">

        <div class="empty">
            Učitavanje rezervacija...
        </div>

    </section>


</main>


<!-- v=4 da Safari ne koristi stari admin.js -->
<script src="js/admin.js?v=4"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NightBook Admin</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            background: #070707;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        .admin-header {
            padding: 22px 20px;
            border-bottom: 1px solid #222;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-logo {
            font-size: 22px;
            font-weight: 900;
        }

        .admin-logo span {
            color: #ffb800;
        }

        .admin-container {
            max-width: 900px;
            margin: auto;
            padding: 30px 18px 80px;
        }

        .admin-title {
            margin-bottom: 30px;
        }

        .admin-title p {
            color: #ffb800;
            font-weight: bold;
            font-size: 12px;
            letter-spacing: 2px;
        }

        .admin-title h1 {
            margin: 8px 0;
            font-size: 32px;
        }

        .admin-stats {
            background: #111;
            border: 1px solid #222;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .admin-stats strong {
            display: block;
            color: #ffb800;
            font-size: 32px;
            margin-top: 5px;
        }

        .reservation-card {
            background: #111;
            border: 1px solid #222;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 18px;
        }

        .reservation-top {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 18px;
        }

        .reservation-club {
            color: #ffb800;
            font-weight: 900;
            font-size: 20px;
            text-transform: uppercase;
        }

        .reservation-date {
            color: #aaa;
        }

        .status {
            background: #ffb800;
            color: #000;
            padding: 7px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 900;
            height: fit-content;
        }

        .reservation-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .info-box {
            background: #090909;
            padding: 13px;
            border-radius: 9px;
        }

        .info-box span {
            display: block;
            color: #777;
            font-size: 11px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .info-box strong {
            font-size: 15px;
        }

        .condition-box {
            margin-top: 15px;
            padding: 15px;
            border: 1px solid #ffb800;
            border-radius: 9px;
        }

        .condition-box span {
            color: #888;
            font-size: 11px;
            display: block;
            margin-bottom: 5px;
        }

        .condition-box strong {
            color: #ffb800;
        }

        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #777;
        }

        .refresh-button {
            width: 100%;
            padding: 15px;
            background: #ffb800;
            color: black;
            border: 0;
            border-radius: 9px;
            font-weight: 900;
            margin-bottom: 25px;
            cursor: pointer;
        }

        @media(max-width: 600px) {
            .reservation-grid {
                grid-template-columns: 1fr;
            }

            .admin-title h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

<header class="admin-header">

    <div class="admin-logo">
        NIGHT<span>BOOK</span>
    </div>

    <div>
        ADMIN
    </div>

</header>


<main class="admin-container">

    <div class="admin-title">

        <p>NIGHTBOOK ADMIN</p>

        <h1>
            REZERVACIJE
        </h1>

        <span>
            Sve rezervacije na jednom mestu.
        </span>

    </div>


    <div class="admin-stats">

        <span>
            UKUPNO REZERVACIJA
        </span>

        <strong id="reservationCount">
            0
        </strong>

    </div>


    <button
        class="refresh-button"
        id="refreshReservations"
    >
        OSVEŽI REZERVACIJE
    </button>


    <div id="reservationsList">

        <div class="empty">
            Učitavanje rezervacija...
        </div>

    </div>

</main>


<script src="js/admin.js"></script>

</body>
</html>
